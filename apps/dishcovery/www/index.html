<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
  <title>Dishcovery Demo</title>
  <link href="main.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      background: #111;
    }
    body.stream {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: auto;
    }
    .device-view {
      margin: 0;
      max-width: 100vw;
      max-height: 92vh;
    }
    .device-view .video canvas,
    .device-view .video video,
    .device-view .touch-layer {
      image-rendering: auto;
    }
    body.stream .control-wrapper {
      display: none !important;
    }
    body.stream .device-view {
      max-width: 100%;
      max-height: 100%;
    }
    html.booting::before {
      content: 'Paleidžiama demo…';
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      padding-top: 60px; box-sizing: border-box;
      background: #111; color: #aaa; font: 14px/1.4 -apple-system, system-ui, sans-serif;
    }
    html.booting::after {
      content: ''; position: fixed; z-index: 2147483647;
      left: 50%; top: 50%; width: 32px; height: 32px; margin: -40px 0 0 -16px;
      border-radius: 50%; border: 3px solid #333; border-top-color: #ddd;
      animation: demo-spin .8s linear infinite;
    }
    @keyframes demo-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var udid = 'redroid:5555';
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      // Scale phone to fit viewport (portrait ~9:20)
      var maxW = Math.min(420, Math.floor(vw * 0.36));
      var maxH = Math.floor(maxW * (1600 / 720));
      if (maxH > vh * 0.88) {
        maxH = Math.floor(vh * 0.88);
        maxW = Math.floor(maxH * (720 / 1600));
      }
      var settings = {
        bitrate: 4000000,
        maxFps: 30,
        iFrameInterval: 1,
        bounds: { width: maxW, height: maxH },
        sendFrameMeta: false,
        lockedVideoOrientation: -1,
        displayId: 0,
      };
      var prefixes = ['WebCodecsPlayer', 'BroadwayDecoder', 'MsePlayer', 'TinyH264Player'];
      var storageKeySuffix = udid + ':' + vw + 'x' + vh;
      try {
        prefixes.forEach(function (prefix) {
          var key = prefix + ':' + storageKeySuffix;
          localStorage.setItem(key, JSON.stringify(settings));
          localStorage.setItem(key + ':fit', 'true');
        });
      } catch (e) {}

      function startStream() {
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var ws = proto + '//' + location.host + '/?action=proxy-adb&remote=tcp:8886&udid=redroid:5555';
        location.replace('/#!' + new URLSearchParams({
          action: 'stream',
          udid: udid,
          player: 'mse',
          ws: ws,
        }).toString());
      }

      if (!location.hash || !location.hash.includes('action=stream')) {
        document.documentElement.classList.add('booting');
        fetch('/demo-reset', { method: 'POST', credentials: 'include' })
          .catch(function () {})
          .finally(function () {
            startStream();
            setTimeout(function () {
              document.documentElement.classList.remove('booting');
            }, 1200);
          });
      }
    })();
  </script>
  <script defer src="bundle.js"></script>
</head>
<body></body>
</html>
