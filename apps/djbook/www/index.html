<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
  <title>DJ Book Demo</title>
  <link href="main.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      background: #111;
    }
    body.stream {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: auto;
    }
    .device-view {
      margin: 0;
      max-width: 100vw;
      max-height: 92vh;
    }
    .device-view .video canvas,
    .device-view .video video,
    .device-view .touch-layer {
      image-rendering: auto;
    }
    body.stream .control-wrapper {
      display: none !important;
    }
    body.stream .device-view {
      max-width: 100%;
      max-height: 100%;
    }
    body:not(.stream) .device-list {
      display: none !important;
    }
    html.booting::before {
      content: 'Paleidžiama demo…';
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      padding-top: 60px; box-sizing: border-box;
      background: #111; color: #aaa; font: 14px/1.4 -apple-system, system-ui, sans-serif;
    }
    html.booting::after {
      content: ''; position: fixed; z-index: 2147483647;
      left: 50%; top: 50%; width: 32px; height: 32px; margin: -40px 0 0 -16px;
      border-radius: 50%; border: 3px solid #333; border-top-color: #ddd;
      animation: demo-spin .8s linear infinite;
    }
    @keyframes demo-spin { to { transform: rotate(360deg); } }
    html.booting.busy::before {
      content: 'Visi demo telefonai šiuo metu užimti. Bandome dar kartą…';
      padding: 32px;
      text-align: center;
    }
  </style>
  <script>
    (function () {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var maxW = Math.min(420, Math.floor(vw * 0.36));
      var maxH = Math.floor(maxW * (1600 / 720));
      if (maxH > vh * 0.88) {
        maxH = Math.floor(vh * 0.88);
        maxW = Math.floor(maxH * (720 / 1600));
      }
      var dpr = window.devicePixelRatio || 1;
      var prefixes = ['WebCodecsPlayer', 'BroadwayDecoder', 'MsePlayer', 'TinyH264Player'];

      function writeSettings(udid) {
        var settings = {
          bitrate: 4000000,
          maxFps: 30,
          iFrameInterval: 3,
          bounds: {
            width: Math.min(720, Math.round(maxW * dpr)),
            height: Math.min(1600, Math.round(maxH * dpr)),
          },
          sendFrameMeta: false,
          lockedVideoOrientation: -1,
          displayId: 0,
        };
        var storageKeySuffix = udid + ':' + vw + 'x' + vh;
        prefixes.forEach(function (prefix) {
          var key = prefix + ':' + storageKeySuffix;
          localStorage.setItem(key, JSON.stringify(settings));
          localStorage.setItem(key + ':fit', 'true');
        });
      }

      function startStream(udid) {
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var ws = proto + '//' + location.host + '/?action=proxy-adb&remote=tcp:8886&udid=' + udid;
        var next = '/#!' + new URLSearchParams({
          action: 'stream',
          udid: udid,
          player: 'mse',
          ws: ws,
        }).toString();
        location.replace(next);
        if (location.pathname.indexOf('/embed') !== 0) {
          location.reload();
        }
      }

      function armLease(session) {
        setInterval(function () {
          fetch('/demo-heartbeat?session=' + encodeURIComponent(session), {
            method: 'POST',
            credentials: 'include',
          }).catch(function () {});
        }, 30000);
        window.addEventListener('pagehide', function () {
          navigator.sendBeacon('/demo-release?session=' + encodeURIComponent(session));
        });
      }

      function requestSlot() {
        document.documentElement.classList.add('booting');
        fetch('/demo-reset', { method: 'POST', credentials: 'include' })
          .then(function (res) {
            if (res.status === 503) {
              document.documentElement.classList.add('busy');
              setTimeout(requestSlot, 15000);
              return null;
            }
            document.documentElement.classList.remove('busy');
            if (!res.ok) throw new Error('reset failed');
            return res.json();
          })
          .then(function (data) {
            if (!data || !data.udid || !data.session) return;
            try {
              sessionStorage.setItem('session', data.session);
              sessionStorage.setItem('udid', data.udid);
              writeSettings(data.udid);
            } catch (e) {}
            startStream(data.udid);
          })
          .catch(function () {
            setTimeout(requestSlot, 15000);
          });
      }

      var session = null;
      try {
        session = sessionStorage.getItem('session');
      } catch (e) {}

      if (location.hash && location.hash.includes('action=stream') && session) {
        document.documentElement.classList.add('booting');
        armLease(session);
        setTimeout(function () {
          document.documentElement.classList.remove('booting');
        }, 1200);
      } else if (!location.hash || !location.hash.includes('action=stream')) {
        requestSlot();
      }
    })();
  </script>
  <script defer src="bundle.js"></script>
</head>
<body></body>
</html>
