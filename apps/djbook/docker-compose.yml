services:
  redroid1:
    image: redroid/redroid:13.0.0_64only-latest
    container_name: redroid-djbook-1
    privileged: true
    restart: unless-stopped
    networks: [demo]
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - ./redroid-data-1:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1600
      - androidboot.redroid_dpi=280
      - androidboot.redroid_fps=30
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
      - ro.product.model=Pixel9
      - ro.product.brand=google
      - ro.product.manufacturer=Google
      - ro.product.device=tokay
      - ro.product.name=tokay
      - ro.build.product=tokay
      - persist.sys.timezone=Europe/Vilnius
      # Public resolvers: the firewall blocks the home router (192.168.0.1)
      - androidboot.redroid_net_ndns=2
      - androidboot.redroid_net_dns1=1.1.1.1
      - androidboot.redroid_net_dns2=8.8.8.8

  redroid2:
    image: redroid/redroid:13.0.0_64only-latest
    container_name: redroid-djbook-2
    privileged: true
    restart: unless-stopped
    networks: [demo]
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - ./redroid-data-2:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1600
      - androidboot.redroid_dpi=280
      - androidboot.redroid_fps=30
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
      - ro.product.model=Pixel9
      - ro.product.brand=google
      - ro.product.manufacturer=Google
      - ro.product.device=tokay
      - ro.product.name=tokay
      - ro.build.product=tokay
      - persist.sys.timezone=Europe/Vilnius
      # Public resolvers: the firewall blocks the home router (192.168.0.1)
      - androidboot.redroid_net_ndns=2
      - androidboot.redroid_net_dns1=1.1.1.1
      - androidboot.redroid_net_dns2=8.8.8.8

  redroid3:
    image: redroid/redroid:13.0.0_64only-latest
    container_name: redroid-djbook-3
    privileged: true
    restart: unless-stopped
    networks: [demo]
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - ./redroid-data-3:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1600
      - androidboot.redroid_dpi=280
      - androidboot.redroid_fps=30
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
      - ro.product.model=Pixel9
      - ro.product.brand=google
      - ro.product.manufacturer=Google
      - ro.product.device=tokay
      - ro.product.name=tokay
      - ro.build.product=tokay
      - persist.sys.timezone=Europe/Vilnius
      # Public resolvers: the firewall blocks the home router (192.168.0.1)
      - androidboot.redroid_net_ndns=2
      - androidboot.redroid_net_dns1=1.1.1.1
      - androidboot.redroid_net_dns2=8.8.8.8

  ws-scrcpy:
    image: ghostry/ws-scrcpy:latest
    container_name: ws-scrcpy-djbook
    restart: unless-stopped
    depends_on:
      - redroid1
      - redroid2
      - redroid3
    networks: [demo]
    volumes:
      - ./www/index.html:/ws-scrcpy/dist/public/index.html:ro
    ports:
      - "127.0.0.1:8002:8000"   # Caddy reverse-proxies to this, not exposed directly

# Fixed subnet so deploy/demo-firewall.sh can keep the emulators off the home
# LAN and the tailnet. They still reach the internet (DJ Book's API on Railway).
networks:
  demo:
    ipam:
      config:
        - subnet: 172.31.80.0/24
